<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لقطات شرقية | Eastern Shots</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #060911;
            font-family: 'Cairo', sans-serif;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .mobile-screen {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: #0b0f19;
            background-image: 
                radial-gradient(circle at 50% -20%, rgba(217, 119, 6, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 50% 120%, rgba(14, 165, 233, 0.12) 0%, transparent 60%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }

        .content-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-top: auto;
            margin-bottom: auto;
        }

        /* Logo Box */
        .logo-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 22px;
            padding: 18px 15px;
            margin-bottom: 22px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .verified-badge {
            position: absolute;
            top: -10px;
            left: 15px;
            background: #0ea5e9;
            color: white;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            border: 2px solid #0b0f19;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .logo-title {
            font-size: 28px;
            font-weight: 900;
            color: #111827;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo-title span.red {
            color: #dc2626;
        }

        .logo-subtitle {
            font-size: 12px;
            font-weight: 800;
            color: #374151;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .handle-tag {
            display: inline-block;
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 16px;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .bio {
            font-size: 15px;
            line-height: 1.6;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* Links Stack */
        .links-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
            color: #ffffff;
            padding: 15px 18px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .link-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.09);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .icon-box {
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .arrow-icon {
            color: #64748b;
            font-size: 15px;
        }

        /* Footer */
        .footer-info {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #475569;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 16px;
            margin-top: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="mobile-screen">
        <div class="content-area">
            <!-- Logo Box -->
            <div class="logo-box">
                <div class="verified-badge">✓</div>
                <div class="logo-title">
                    لقطا<span class="red">ت</span> شرقي<span class="red">ة</span>
                </div>
                <div class="logo-subtitle">Eastern Shots</div>
            </div>

            <div class="handle-tag">@eastern.shots</div>
            <p class="bio">منصة اجتماعية سعودية تهتم بأخبار ومحتوى وفعاليات المنطقة الشرقية 🇸🇦</p>

            <!-- Links -->
            <div class="links-stack">
                <a href="https://www.snapchat.com/add/eastern.shots" class="link-card" target="_blank" rel="me noopener">
                    <div class="link-left">
                        <div class="icon-box">👻</div>
                        <span>سناب شات · Snapchat</span>
                    </div>
                    <div class="arrow-icon">←</div>
                </a>

                <a href="https://www.tiktok.com/@eastern.shots" class="link-card" target="_blank" rel="me noopener">
                    <div class="link-left">
                        <div class="icon-box">♪</div>
                        <span>تيك توك · TikTok</span>
                    </div>
                    <div class="arrow-icon">←</div>
                </a>

                <a href="https://www.instagram.com/eastern.shots" class="link-card" target="_blank" rel="me noopener">
                    <div class="link-left">
                        <div class="icon-box">📸</div>
                        <span>انستغرام · Instagram</span>
                    </div>
                    <div class="arrow-icon">←</div>
                </a>

                <a href="https://heylink.me/eastern.shots/" class="link-card" target="_blank" rel="me noopener">
                    <div class="link-left">
                        <div class="icon-box">🔗</div>
                        <span>جميع الروابط · HeyLink</span>
                    </div>
                    <div class="arrow-icon">←</div>
                </a>
            </div>
        </div>

        <div class="footer-info">
            © 2026 لقطات شرقية | جميع الحقوق محفوظة
        </div>
    </div>

</body>
</html>
